[project]
name = "poe2-bot"
version = "0.1.0"
description = "Path of Exile 2 — Smart External Map Runner Bot"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[project.scripts]
poe2bot = "poe2bot.__main__:main"

[project.dependencies]
# Vision
opencv-python = ">=4.10.0"
pytesseract = ">=0.3.13"
numpy = ">=2.0.0"
pillow = ">=10.4.0"

# Config
tomli = ">=2.0.2"  # fallback если python < 3.11
pydantic = ">=2.9.0"

# FSM
transitions = ">=0.9.2"

# Async
anyio = ">=4.6.0"

# Utils
loguru = ">=0.7.2"
rich = ">=13.9.0"  # CLI output

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-Pillow>=10.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (типизация)
    "RUF", # ruff-specific
]
ignore = [
    "ANN101",  # self annotation
    "ANN102",  # cls annotation
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "tools/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
